<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Tracker</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        /* NAVBAR */
        header {
            background: #0f172a;
            color: white;
            padding: 18px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            color: #38bdf8;
        }

        header span {
            color: white;
        }

        /* MAIN */
        .container {
            width: 90%;
            max-width: 1100px;
            margin: 35px auto;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h1 {
            font-size: 30px;
            margin-bottom: 5px;
        }

        .welcome p {
            color: #64748b;
        }

        /* SUMMARY CARDS */
        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .card h3 {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 10px;
        }

        .card h2 {
            font-size: 28px;
        }

        .balance {
            color: #2563eb;
        }

        .income {
            color: #16a34a;
        }

        .expense {
            color: #dc2626;
        }

        /* CONTENT */
        .content {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 25px;
        }

        .box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .box h2 {
            margin-bottom: 20px;
        }

        /* FORM */
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 17px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        /* TRANSACTIONS */
        .transactions {
            max-height: 500px;
            overflow-y: auto;
        }

        .transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        .transaction:last-child {
            border-bottom: none;
        }

        .transaction-info h4 {
            margin-bottom: 5px;
        }

        .transaction-info small {
            color: #64748b;
        }

        .transaction-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .amount {
            font-weight: bold;
        }

        .amount.income {
            color: #16a34a;
        }

        .amount.expense {
            color: #dc2626;
        }

        .delete-btn {
            width: auto;
            padding: 7px 10px;
            background: #fee2e2;
            color: #dc2626;
            font-size: 13px;
        }

        .delete-btn:hover {
            background: #fecaca;
        }

        .empty {
            text-align: center;
            padding: 40px 10px;
            color: #94a3b8;
        }

        /* FOOTER */
        footer {
            text-align: center;
            margin-top: 40px;
            padding: 25px;
            background: #0f172a;
            color: #94a3b8;
        }

        /* MOBILE */
        @media (max-width: 800px) {

            .summary {
                grid-template-columns: 1fr;
            }

            .content {
                grid-template-columns: 1fr;
            }

            .transaction {
                align-items: flex-start;
            }

            .transaction-right {
                flex-direction: column;
                gap: 5px;
            }

            header {
                padding: 18px 5%;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <header>
        <h2>Expense<span>Tracker</span></h2>
        <div>My Finances</div>
    </header>


    <main class="container">

        <!-- WELCOME -->
        <section class="welcome">
            <h1>Expense Dashboard</h1>
            <p>Track your income and expenses easily.</p>
        </section>


        <!-- SUMMARY -->
        <section class="summary">

            <div class="card">
                <h3>Total Balance</h3>
                <h2 class="balance" id="balance">₹0.00</h2>
            </div>

            <div class="card">
                <h3>Total Income</h3>
                <h2 class="income" id="income">₹0.00</h2>
            </div>

            <div class="card">
                <h3>Total Expenses</h3>
                <h2 class="expense" id="expense">₹0.00</h2>
            </div>

        </section>


        <!-- MAIN CONTENT -->
        <section class="content">

            <!-- ADD TRANSACTION -->
            <div class="box">

                <h2>Add Transaction</h2>

                <form id="transactionForm">

                    <label for="description">
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        placeholder="e.g. Grocery shopping"
                        required
                    >


                    <label for="amount">
                        Amount
                    </label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="0"
                        step="0.01"
                        required
                    >


                    <label for="type">
                        Type
                    </label>

                    <select id="type">
                        <option value="expense">
                            Expense
                        </option>

                        <option value="income">
                            Income
                        </option>
                    </select>


                    <label for="category">
                        Category
                    </label>

                    <select id="category">

                        <option value="Food">
                            🍔 Food
                        </option>

                        <option value="Transport">
                            🚗 Transport
                        </option>

                        <option value="Shopping">
                            🛒 Shopping
                        </option>

                        <option value="Bills">
                            💡 Bills
                        </option>

                        <option value="Entertainment">
                            🎮 Entertainment
                        </option>

                        <option value="Education">
                            📚 Education
                        </option>

                        <option value="Health">
                            ❤️ Health
                        </option>

                        <option value="Salary">
                            💰 Salary
                        </option>

                        <option value="Other">
                            📦 Other
                        </option>

                    </select>


                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >


                    <button type="submit">
                        + Add Transaction
                    </button>

                </form>

            </div>


            <!-- TRANSACTION LIST -->
            <div class="box">

                <h2>Recent Transactions</h2>

                <div id="transactions" class="transactions">
                    <div class="empty">
                        No transactions yet.
                    </div>
                </div>

            </div>

        </section>

    </main>


    <footer>
        © 2026 Expense Tracker | Manage your money better
    </footer>


    <script>

        // Load saved transactions
        let transactions =
            JSON.parse(localStorage.getItem("transactions")) || [];


        // Set today's date automatically
        document.getElementById("date").value =
            new Date().toISOString().split("T")[0];


        // FORM SUBMISSION
        document
            .getElementById("transactionForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                const description =
                    document.getElementById("description").value;

                const amount =
                    parseFloat(
                        document.getElementById("amount").value
                    );

                const type =
                    document.getElementById("type").value;

                const category =
                    document.getElementById("category").value;

                const date =
                    document.getElementById("date").value;


                const transaction = {

                    id: Date.now(),

                    description: description,

                    amount: amount,

                    type: type,

                    category: category,

                    date: date
                };


                transactions.push(transaction);

                saveTransactions();

                displayTransactions();

                updateSummary();

                // Clear form
                document.getElementById("description").value = "";
                document.getElementById("amount").value = "";

            });


        // SAVE DATA
        function saveTransactions() {

            localStorage.setItem(
                "transactions",
                JSON.stringify(transactions)
            );

        }


        // DISPLAY TRANSACTIONS
        function displayTransactions() {

            const container =
                document.getElementById("transactions");


            if (transactions.length === 0) {

                container.innerHTML =
                    `<div class="empty">
                        No transactions yet.
                    </div>`;

                return;
            }


            // Newest first
            const sortedTransactions =
                [...transactions].reverse();


            container.innerHTML =
                sortedTransactions.map(transaction => {

                    const sign =
                        transaction.type === "income"
                            ? "+"
                            : "-";


                    return `
                        <div class="transaction">

                            <div class="transaction-info">

                                <h4>
                                    ${escapeHTML(transaction.description)}
                                </h4>

                                <small>
                                    ${transaction.category}
                                    •
                                    ${transaction.date}
                                </small>

                            </div>


                            <div class="transaction-right">

                                <span class="amount ${transaction.type}">
                                    ${sign} ₹${transaction.amount.toFixed(2)}
                                </span>

                                <button
                                    class="delete-btn"
                                    onclick="deleteTransaction(${transaction.id})"
                                >
                                    Delete
                                </button>

                            </div>

                        </div>
                    `;

                }).join("");

        }


        // DELETE TRANSACTION
        function deleteTransaction(id) {

            transactions =
                transactions.filter(
                    transaction => transaction.id !== id
                );

            saveTransactions();

            displayTransactions();

            updateSummary();

        }


        // UPDATE SUMMARY
        function updateSummary() {

            let totalIncome = 0;
            let totalExpense = 0;


            transactions.forEach(transaction => {

                if (transaction.type === "income") {

                    totalIncome += transaction.amount;

                } else {

                    totalExpense += transaction.amount;

                }

            });


            const balance =
                totalIncome - totalExpense;


            document.getElementById("income").textContent =
                "₹" + totalIncome.toFixed(2);


            document.getElementById("expense").textContent =
                "₹" + totalExpense.toFixed(2);


            document.getElementById("balance").textContent =
                "₹" + balance.toFixed(2);

        }


        // Prevent HTML injection when displaying descriptions
        function escapeHTML(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }


        // Initial display
        displayTransactions();

        updateSummary();

    </script>

</body>
</html>
